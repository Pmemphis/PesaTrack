app = "pesatrack-staging-pmemphis"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_DEBUG = "false"
  ALLOWED_HOSTS = "pesatrack-staging-pmemphis.fly.dev"
  CORS_ALLOWED_ORIGINS = "https://pesatrack-staging-pmemphis.web.app"
  CSRF_TRUSTED_ORIGINS = "https://pesatrack-staging-pmemphis.web.app"
  BACKEND_PUBLIC_URL = "https://pesatrack-staging-pmemphis.fly.dev"
  FRONTEND_PUBLIC_URL = "https://pesatrack-staging-pmemphis.web.app"
  TOKEN_TTL_DAYS = "30"
  TRUST_X_FORWARDED_PROTO = "true"

[deploy]
  release_command = "python manage.py migrate && python manage.py createcachetable"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    method = "GET"
    path = "/api/health/"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
